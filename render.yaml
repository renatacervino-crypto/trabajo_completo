services:
  - type: web
    name: lelixir-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://trabajo-completo-eight.vercel.app,https://lelixir.vercel.app
      - key: PROJECT_NAME
        value: "L'Élixir - API de Productos"
